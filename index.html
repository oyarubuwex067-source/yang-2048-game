<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>杨的2048</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8ef;color:#776e65;font-family:system-ui;padding:24px 16px}main{max-width:420px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:64px;margin:0;letter-spacing:-4px}.scores{display:flex;gap:8px}.score{background:#bbada0;color:white;padding:10px 14px;border-radius:8px;text-align:center;font-weight:bold}.score small{display:block;font-size:12px;color:#eee4da}.tools{display:flex;justify-content:space-between;margin:20px 0}button{background:#8f7a66;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;font-size:15px;cursor:pointer}button:disabled{opacity:.4}#board{background:#bbada0;padding:10px;border-radius:12px;touch-action:none;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cell{aspect-ratio:1;background:#cdc1b4;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,8vw,42px);font-weight:800}.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin:18px}.pad button{font-size:22px}p{font-size:14px;line-height:1.7}#message{text-align:center;min-height:28px;padding-top:12px;font-weight:bold}</style><main><header><h1>2048</h1><div class="scores"><div class="score"><small>得分</small><span id="score">0</span></div><div class="score"><small>最佳</small><span id="best">0</span></div></div></header><div class="tools"><button id="undo">撤回一步</button><button id="new">重新开始</button></div><div id="board" aria-label="2048棋盘"></div><div id="message" aria-live="polite"></div><div class="pad"><span></span><button data-dir="up">↑</button><span></span><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div><p><b>滑动棋盘或点击箭头开始玩。</b><br>相同数字合并，拼出2048！电脑也可使用方向键。进度自动保存在当前浏览器。</p><footer style="margin-top:32px;text-align:center;font-size:13px;color:#8f7a66">何娇是猪</footer></main><script>
const $=id=>document.getElementById(id);let a=Array(16).fill(0),score=0,best=0,prev=null,won=false;const palette=['#eee4da','#ede0c8','#f2b179','#f59563','#f67c5f','#f65e3b','#edcf72','#edcc61','#edc850','#edc53f','#edc22e'];function spawn(){let e=a.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)a[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}function possible(){return a.some((v,i)=>!v||(i%4<3&&v===a[i+1])||(i<12&&v===a[i+4]))}function render(){best=Math.max(best,score);$('score').textContent=score;$('best').textContent=best;$('undo').disabled=!prev;$('board').replaceChildren(...a.map(v=>{let d=document.createElement('div');d.className='cell';d.textContent=v||'';if(v){d.style.background=palette[Math.log2(v)-1]||'#3c3a32';d.style.color=v>4?'white':'#776e65';if(v>=1024)d.style.fontSize='clamp(18px,6vw,30px)'}return d}));$('message').textContent=!possible()?'这局结束啦，试试撤回或重新开始！':won?'你拼出了2048！可以继续挑战。':'';try{localStorage.setItem('yang2048',JSON.stringify({a,score,best,won}))}catch{}}function start(){a=Array(16).fill(0);score=0;prev=null;won=false;spawn();spawn();render()}function move(dir){let old=a.slice(),s=score,w=won;for(let l=0;l<4;l++){let ix=Array.from({length:4},(_,k)=>dir==='left'?l*4+k:dir==='right'?l*4+3-k:dir==='up'?k*4+l:(3-k)*4+l);let v=ix.map(i=>a[i]).filter(Boolean),out=[];for(let k=0;k<v.length;k++){if(v[k]===v[k+1]){out.push(v[k]*2);score+=v[k]*2;k++}else out.push(v[k])}while(out.length<4)out.push(0);ix.forEach((i,k)=>a[i]=out[k])}if(a.every((v,i)=>v===old[i]))return;prev={a:old,score:s,won:w};spawn();won=won||a.some(v=>v>=2048);render()}$('undo').onclick=()=>{if(prev){a=prev.a;score=prev.score;won=prev.won;prev=null;render()}};$('new').onclick=()=>{if(!score||confirm('重新开始这一局？'))start()};document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));window.addEventListener('keydown',e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();move(d)}});let origin=null;$('board').onpointerdown=e=>{origin=[e.clientX,e.clientY];$('board').setPointerCapture(e.pointerId)};$('board').onpointerup=e=>{if(!origin)return;let x=e.clientX-origin[0],y=e.clientY-origin[1];origin=null;if(Math.max(Math.abs(x),Math.abs(y))>20)move(Math.abs(x)>Math.abs(y)?x>0?'right':'left':y>0?'down':'up')};$('board').onpointercancel=()=>origin=null;try{let v=JSON.parse(localStorage.getItem('yang2048'));if(v&&Array.isArray(v.a)&&v.a.length===16&&v.a.every(n=>Number.isInteger(n)&&n>=0)){a=v.a;score=v.score||0;best=v.best||0;won=!!v.won;render()}else start()}catch{start()}
</script></html>
